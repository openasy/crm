# CRM's settings. This file is the only place they are changed; a change is picked up within a minute, and a file
# with a mistake leaves the last good one in place. Companies, contacts and deals are worked in the UI.
currency: TRY
time_zone: Europe/Istanbul

pipelines:
  sales:
    name: Sales
    stages: # a deal counts toward the forecast at its value times its stage's probability
      - { id: lead, name: Lead, probability: 10%, stale_after: 14d }
      - { id: demo, name: Demo, probability: 25%, stale_after: 10d }
      - { id: proposal, name: Proposal, probability: 50%, stale_after: 10d }
      - { id: negotiation, name: Negotiation, probability: 75%, stale_after: 7d }
    lost_reasons: [Chose a cheaper tool, Not this year, Needed payroll too, Stopped answering]

# The plans companies are on. Helpdesk routes tickets and sets SLAs by the plan's id.
plans:
  free: Free
  pro: Pro
  business: Business

leads:
  stage: lead # where leads from Live Chat, forms and the API start
  # owner: emily@example.com   # who owns a lead whose sender names no member

quotes:
  vat: 20% # KDV, shown separately on the PDF
  valid_for: 30d
  language: tr # the PDF's language: tr, en or de
  seller:
    name: Acme Yazılım A.Ş.
    address: Büyükdere Cad. 1, 34394 Şişli, İstanbul
    tax_office: Zincirlikuyu
    tax_number: "1234567890"
    email: sales@example.com
  terms: Ödeme fatura tarihinden itibaren 30 gün içinde yapılır.

tasks:
  remind_at: "08:00" # reminders go out by email the morning a task is due


